<!-- Selector de tema visual (el texto que lo acompaña lo pone la ventana de configuración) -->
<p-select
  appendTo="body"
  inputId="selector-tema"
  [options]="temasDisponibles"
  [(ngModel)]="temaSeleccionado"
  optionLabel="name"
  (onChange)="onCambiarTema()"
  placeholder="Selecciona un tema">
</p-select>
